const G={主席:0,副主席:1,核心书记:2,常委:2,'政治局委员':3,'政治局候补委员':4,'书记处书记':4,'书记处候补书记':5,'中央委员':5,'中央候补委员':6,其他:7};
const special=['逝世','撤职','受冲击','复出'];
let state={tab:'era',idx:0,search:'',a:'邓小平',b:'高岗',person:'邓小平',showAll:false};
const $=x=>document.getElementById(x);
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function last(name,date){let list=DB.persons[name].filter(x=>x.date<=date);return list.length?list[list.length-1]:null}
function latest(name){let a=DB.persons[name];return a[a.length-1]}
function visible(date){return N.map(n=>({name:n,item:last(n,date)})).filter(o=>o.item)}
function label(l){return l==='受冲击'?'受到冲击':l}
function tag(l){return `<span class="tag ${['受冲击','撤职','逝世'].includes(l)?'down':['复出'].includes(l)?'up':G[l]!==undefined&&G[l]<3?'high':''}">${esc(label(l))}</span>`}
function select(id,val){return `<select id="${id}">${N.map(n=>`<option value="${esc(n)}" ${n===val?'selected':''}>${esc(n)}</option>`).join('')}</select>`}
function tabs(t){state.tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tabs(b.dataset.tab));
function stats(){let events=Object.values(DB.persons).flat();$('stats').innerHTML=`<div class="stat"><strong>${N.length}</strong><small>首批人物档案</small></div><div class="stat"><strong>${DB.nodes.length}</strong><small>历史节点</small></div><div class="stat"><strong>${events.length}</strong><small>人物状态记录</small></div><div class="stat"><strong>1949—1978</strong><small>观察范围</small></div>`}
function era(){let n=DB.nodes[state.idx],arr=visible(n.date),changes=[];for(let i=0;i<N.length;i++){let a=DB.persons[N[i]].filter(e=>e.date<=n.date&&e.date>(state.idx?DB.nodes[state.idx-1].date:'1900-01-01'));changes.push(...a.map(x=>({...x,name:N[i]})))}let sorted=arr.sort((a,b)=>{let ga=G[a.item.level]??99,gb=G[b.item.level]??99;return ga-gb||a.name.localeCompare(b.name,'zh-Hans-CN')});$('app').innerHTML=`<div class="panel"><div class="toolbar"><button class="btn" id="prev">◀ 上一个节点</button><input type="range" min="0" max="${DB.nodes.length-1}" value="${state.idx}" id="range" aria-label="历史节点"><button class="btn" id="next">下一个节点 ▶</button><button class="btn" id="play">连续播放</button></div><div class="eyebrow">${n.date.slice(0,4)} · ${esc(n.label)}</div><h2 style="font-size:24px;margin:5px 0">${esc(n.detail)}</h2><div class="note">节点日期用于回放切片；部分年度事件用近似月初日期标记，不代表精确发生日。</div></div><div class="layout"><div><div class="panel"><h2>本节点人物变化 <span class="pill">${changes.length} 条记录</span></h2>${changes.length?changes.map(x=>`<div class="leader"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.date)} · ${esc(x.detail)}</div></div>${tag(x.level)}</div>`).join(''):'<div class="empty">本节点暂无新增人物记录，不表示期间没有人事变动。</div>'}</div></div><aside class="panel"><h2>已录入人物的最近状态</h2><p class="note">${arr.length} 人有截至此时的记录。按职务类别分组，不是实际权力榜。负面状态保留最后记录，并不自动推断此前职务已全部撤销。</p>${sorted.map(o=>`<div class="leader"><span class="nm">${esc(o.name)}</span>${tag(o.item.level)}</div>`).join('')}</aside></div>`; $('prev').onclick=()=>{state.idx=Math.max(0,state.idx-1);render()};$('next').onclick=()=>{state.idx=Math.min(DB.nodes.length-1,state.idx+1);render()};$('range').oninput=e=>{state.idx=+e.target.value;render()};$('play').onclick=async()=>{let start=state.idx;for(let j=start+1;j<DB.nodes.length;j++){state.idx=j;render();await new Promise(r=>setTimeout(r,750));if(state.tab!=='era')break}}}
function people(){let names=N.filter(x=>x.includes(state.search));$('app').innerHTML=`<div class="panel"><div class="toolbar"><input id="search" placeholder="搜索人物姓名" value="${esc(state.search)}"><span class="muted">点击人物查看完整节点记录</span></div><div class="cards">${names.map(n=>`<div class="person" data-name="${esc(n)}"><h3>${esc(n)}</h3><div class="now">${esc(latest(n).level)}</div><div class="note">${esc(latest(n).date)} · ${esc(latest(n).detail)}</div></div>`).join('')}</div></div><div id="detail"></div>`;$('search').oninput=e=>{state.search=e.target.value;people()};document.querySelectorAll('.person').forEach(el=>el.onclick=()=>{state.person=el.dataset.name;detail();$('detail').scrollIntoView({behavior:'smooth',block:'start'})});detail()}
function detail(){let n=state.person;if(!$('detail'))return;$('detail').innerHTML=`<div class="panel"><h2>${esc(n)} · 政治生涯轨迹</h2><div class="timeline">${DB.persons[n].map(x=>`<div class="entry"><span class="date">${esc(x.date)}</span> ${tag(x.level)}<p>${esc(x.detail)}</p></div>`).join('')}</div><div class="note">记录为抽样节点，并非完整履历。受冲击、复出等为政治状态标记，不是正式党职。</div></div>`}
function compare(){let a=DB.persons[state.a],b=DB.persons[state.b],years=[...new Set([...a,...b].map(x=>x.date))].sort();$('app').innerHTML=`<div class="panel"><h2>双人命运对照</h2><div class="toolbar">${select('a',state.a)} <span>与</span> ${select('b',state.b)}</div><p class="note">观察谁先担任某一正式职务、谁曾失势及复出；不自动宣称跨系统职务的高低或政治关系逆转。</p></div><div class="compare">${[state.a,state.b].map(n=>`<div class="panel"><h2>${esc(n)}</h2>${DB.persons[n].map(x=>`<div class="rowitem"><div class="date" style="color:var(--gold)">${x.date} ${tag(x.level)}</div><div>${esc(x.detail)}</div></div>`).join('')}</div>`).join('')}</div>`;$('a').onchange=e=>{state.a=e.target.value;render()};$('b').onchange=e=>{state.b=e.target.value;render()}}
function curve(){let selected=[state.a,state.b];let data=selected.map(n=>({name:n,events:DB.persons[n].filter(x=>G[x.level]!==undefined)}));const dates=DB.nodes.map(n=>n.date);const W=930,H=360,padL=95,padR=30,padT=28,padB=44;const scales=[['中央主席','主席'],['中央副主席','副主席'],['书记处/常委','核心书记','常委'],['政治局委员','政治局委员'],['政治局候补等','政治局候补委员','书记处书记'],['中央委员等','书记处候补书记','中央委员'],['中央候补委员','中央候补委员'],['其他','其他']];let y=l=>padT+(G[l]??7)*(H-padT-padB)/7;let x=d=>{let day=Date.parse(d);return padL+(day-Date.parse('1949-01-01'))/(Date.parse('1979-01-01')-Date.parse('1949-01-01'))*(W-padL-padR)};let lines=data.map((o,i)=>{let pts=o.events.map(e=>`${x(e.date).toFixed(1)},${y(e.level).toFixed(1)}`).join(' ');return `<polyline points="${pts}" fill="none" stroke="${i?'#7cb9f2':'#f1c47b'}" stroke-width="3" stroke-linejoin="round"/>`+o.events.map(e=>`<circle cx="${x(e.date)}" cy="${y(e.level)}" r="5" fill="${i?'#7cb9f2':'#f1c47b'}"><title>${esc(o.name)} ${e.date} ${esc(e.detail)}</title></circle>`).join('')}).join('');let ylines=scales.map((s,i)=>`<line x1="${padL}" y1="${y(s[1])}" x2="${W-padR}" y2="${y(s[1])}" stroke="#354052"/><text fill="#b2becc" x="5" y="${y(s[1])+5}" font-size="12">${s[0]}</text>`).join('');let xlabels=[1949,1954,1959,1964,1969,1974,1978].map(yr=>`<text fill="#b2becc" x="${x(yr+'-01-01')}" y="${H-11}" text-anchor="middle" font-size="12">${yr}</text>`).join('');$('app').innerHTML=`<div class="panel"><h2>正式职务层级轨迹（不代表综合权力评分）</h2><div class="toolbar">${select('a',state.a)} ${select('b',state.b)}</div><div class="legend"><span><span class="swatch" style="background:var(--gold)"></span>${esc(state.a)}</span><span><span class="swatch" style="background:var(--blue)"></span>${esc(state.b)}</span></div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="人物职务节点变化示意图">${ylines}${xlabels}${lines}</svg></div><p class="note">折线仅连接已登记的正式职务类别；连接线用于视觉引导，不意味着中间各年连续持有同一职务。失势、撤职与死亡在此不绘为职级零分，请在生涯记录中查看。书记处与政治局的不同制度安排不能据此判定跨系统实际高低。</p></div>`;$('a').onchange=e=>{state.a=e.target.value;render()};$('b').onchange=e=>{state.b=e.target.value;render()}}
function sources(){ $('app').innerHTML=`<div class="panel"><h2>资料与方法</h2><p>本版采用14个历史节点和首批${N.length}个人物的抽样记录，优先保留正式机构的任免资料。相关历史事件及关键职务依据以下公开汇编和名单建立研究初稿，后续须逐条补充页码/原始文献。</p><div class="sources">${DB.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a>`).join('')}</div><h2>局限与待做</h2><p>① 目前是节点事件样本，不是所有任免的完整数据库。② 个别事件使用月初占位日期，界面已提示，正式版需精确核验。③ 中央委员、书记处书记、军政职务不可随意合并为一个精确权力排名。④ 当前未添加私人关系和政治派系推断。⑤ 尚未逐人补齐原始证据链，不能作学术定稿。</p><button class="btn" id="export">导出已录入数据（JSON）</button></div>`;$('export').onclick=()=>{let blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='republic_history_data_v01.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function render(){stats();({era,people,compare,curve,sources})[state.tab]()}render();
</script></body></html>
